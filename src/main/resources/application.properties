spring.application.name=pgfinder-backend
server.port=8080
spring.profiles.default=dev

# ---------- MySQL ----------
# The database "pgfinder" is created automatically on first run.
# Set your MySQL password before starting, e.g. in PowerShell:  $env:DB_PASSWORD = "your-password"
spring.datasource.url=jdbc:mysql://localhost:3306/pgfinder?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates tables from the @Entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Load rooms/beds/amenities/images for up to 100 PGs per query instead of one query per PG (avoids N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Frontend allowed to call this API (CORS)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
