# "dev" profile: in-memory H2 database, no MySQL needed. Data is lost when the app stops.
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:mem:pgfinder;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Browse the tables at http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:pgfinder)
spring.h2.console.enabled=true
